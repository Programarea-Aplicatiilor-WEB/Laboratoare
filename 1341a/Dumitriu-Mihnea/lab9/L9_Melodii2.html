<!DOCTYPE html>
<html>
<head>
<title>Tabel melodii (Bonus)</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}

* {
  box-sizing: border-box;
}

.loginPopup {
  position: relative;
  text-align: center;
  width: 100%;
}

.formPopup {
  display: none;
  position: fixed;
  left: 45%;
  top: 5%;
  transform: translate(-50%, 5%);
  border: 3px solid #999999;
  z-index: 9;
}

.formContainer {
  max-width: 400px;
  padding: 20px;
  background-color: #fff;
}

.formContainer input[type=text] {
  width: 80%;
  padding: 15px;
  margin: 5px 0 20px 0;
  border: none;
  background: #eee;
}
</style>
</head>
<body>
<h1>Melodii incarcate de pe server</h1>

<p>
<button onclick="incarcaDePeServer('Melodii_JSON.txt')">Incarca melodiile de pe server</button>
<br><br>
<button onclick="openFormA()">Adauga melodie</button>
</p>

<p id="mesajEroare" style="color: red; font-weight: bold;"></p>

<table id="tm">
  <tr>
    <th>Titlu</th>
    <th>Interpretata de</th>
    <th>Versuri</th>
    <th>Muzica</th>
    <th colspan="2" style="text-align:center">Operatii</th>
  </tr>
</table>

<div><span id="raw"></span></div>

<div class="formPopup" id="adauga">
  <form action="javascript:;" onsubmit="adaugaMelodie(this)" class="formContainer">
    <h2>Adauga melodie</h2>
    <label for="titlu"><strong>Titlu</strong></label>
    <input type="text" id="titlu" placeholder="Titlul melodiei" name="titlu" required>
    <label for="interpretare"><strong>Interpretata de</strong></label>
    <input type="text" id="interpretare" placeholder="Interpret" name="interpretare" required>
    <label for="versuri"><strong>Versuri</strong></label>
    <input type="text" id="versuri" placeholder="Autor versuri" name="versuri" required>
    <label for="muzica"><strong>Muzica</strong></label>
    <input type="text" id="muzica" placeholder="Autor muzica" name="muzica" required>
    <button type="submit" class="btn">Adauga</button>
    <button type="button" class="btn cancel" onclick="closeForm('adauga')">Close</button>
  </form>
</div>

<div class="formPopup" id="modifica">
  <form action="javascript:;" onsubmit="modificaMelodie()" class="formContainer">
    <h2>Modifica melodie</h2>
    <label for="titluM"><strong>Titlu</strong></label>
    <input type="text" id="titluM" placeholder="Titlul melodiei" name="titluM" required>
    <label for="interpretareM"><strong>Interpretata de</strong></label>
    <input type="text" id="interpretareM" placeholder="Interpret" name="interpretareM" required>
    <label for="versuriM"><strong>Versuri</strong></label>
    <input type="text" id="versuriM" placeholder="Autor versuri" name="versuriM" required>
    <label for="muzicaM"><strong>Muzica</strong></label>
    <input type="text" id="muzicaM" placeholder="Autor muzica" name="muzicaM" required>
    <button type="submit" class="btn">Modifica</button>
    <button type="button" class="btn cancel" onclick="closeForm('modifica')">Close</button>
  </form>
</div>

<script>
const melodii2Show = [];
let fileContent;
let nr = 0;

window.onload = function() {
  let salvate = localStorage.getItem("melodiiArray");
  if (salvate) {
    try {
      let parsed = JSON.parse(salvate);
      melodii2Show.length = 0;
      for (let i = 0; i < parsed.length; i++) {
        melodii2Show.push(parsed[i]);
      }
      afiseazaTabel();
    } catch (e) {
      document.getElementById("mesajEroare").innerHTML = "Eroare la citirea datelor din Local Storage: " + e.message;
    }
  }
};

async function incarcaDePeServer(file) {
  let zonaEroare = document.getElementById("mesajEroare");
  zonaEroare.innerHTML = "";

  try {
    let raspuns = await fetch(file);
    if (!raspuns.ok) {
      throw new Error("Fisierul '" + file + "' nu a putut fi incarcat (cod " + raspuns.status + ").");
    }
    fileContent = await raspuns.text();
    document.getElementById("raw").innerHTML = fileContent;

    let melodiiStored = JSON.parse(fileContent);
    melodii2Show.length = 0;
    for (let i = 0; i < melodiiStored.length; i++) {
      melodii2Show.push(melodiiStored[i]);
    }
    localStorage.setItem("melodiiArray", JSON.stringify(melodii2Show));
    afiseazaTabel();
  } catch (e) {
    zonaEroare.innerHTML = "Eroare: " + e.message;
  }
}

function afiseazaTabel() {
  document.getElementById("tm").innerHTML =
    "<tr><th>Titlu</th><th>Interpretata de</th><th>Versuri</th><th>Muzica</th><th colspan=2 style='text-align:center'>Operatii</th></tr>";

  for (let i = 0; i < melodii2Show.length; i++) {
    let m = melodii2Show[i];
    let m_curenta = new melodie(m.titlu, m.muzica, m.versuri, m.interpretare);
    document.getElementById("tm").innerHTML +=
      m_curenta.randNou() +
      "<td><button onclick='openForm(" + i + ")'>Modificare</button></td>" +
      "<td><button onclick='stergeMelodie(" + i + ")'>Stergere</button></td></tr>";
  }
}

function stergeMelodie(index) {
  melodii2Show.splice(index, 1);
  localStorage.setItem("melodiiArray", JSON.stringify(melodii2Show));
  afiseazaTabel();
}

function melodie(ti, mu, ve, i) {
  this.titlu = ti;
  this.muzica = mu;
  this.versuri = ve;
  this.interpretare = i;
  this.randNou = function() {
    return "<tr><td>" + this.titlu + "</td><td>" + this.interpretare + "</td><td>" + this.versuri + "</td><td>" + this.muzica + "</td>";
  };
}

function adaugaMelodie(frm) {
  let mNoua = {
    titlu: frm.titlu.value,
    interpretare: frm.interpretare.value,
    versuri: frm.versuri.value,
    muzica: frm.muzica.value
  };

  melodii2Show.push(mNoua);
  localStorage.setItem("melodiiArray", JSON.stringify(melodii2Show));
  afiseazaTabel();

  frm.reset();
  closeForm("adauga");
}

function modificaMelodie() {
  let mMod = {
    titlu: document.getElementById("titluM").value,
    interpretare: document.getElementById("interpretareM").value,
    versuri: document.getElementById("versuriM").value,
    muzica: document.getElementById("muzicaM").value
  };

  melodii2Show.splice(nr, 1, mMod);
  localStorage.setItem("melodiiArray", JSON.stringify(melodii2Show));

  closeForm("modifica");
  afiseazaTabel();
}

function openFormA() {
  document.getElementById("adauga").style.display = "block";
}

function openForm(rand) {
  let frm = document.getElementById("modifica");
  frm.style.display = "block";
  nr = rand;
  document.getElementById("titluM").value = melodii2Show[nr].titlu;
  document.getElementById("interpretareM").value = melodii2Show[nr].interpretare;
  document.getElementById("versuriM").value = melodii2Show[nr].versuri;
  document.getElementById("muzicaM").value = melodii2Show[nr].muzica;
}

function closeForm(opt) {
  document.getElementById(opt).style.display = "none";
}
</script>
</body>
</html>
