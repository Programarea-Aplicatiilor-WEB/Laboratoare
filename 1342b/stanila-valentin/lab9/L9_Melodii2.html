<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tabel melodii (LocalStorage + Fetch)</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}

* {
  box-sizing: border-box;
}

#mesajEroare {
  color: #b00020;
  font-weight: bold;
  margin: 12px 0;
}

.loginPopup {
  position: relative;
  text-align: center;
  width: 100%;
}

.formPopup {
  display: none;
  position: fixed;
  left: 45%;
  top: 5%;
  transform: translate(-50%, 5%);
  border: 3px solid #999999;
  z-index: 9;
}

.formContainer {
  max-width: 400px;
  padding: 20px;
  background-color: #fff;
}

.formContainer input[type=text] {
  width: 80%;
  padding: 15px;
  margin: 5px 0 20px 0;
  border: none;
  background: #eee;
}
</style>
</head>
<body>
<h1>Melodii incarcate de pe server</h1>

<p>
<button onclick="incarcaMelodiiServer('Melodii_JSON.txt')">Incarca melodiile de pe server</button>
<br><br>
<button onclick="openFormA()">Adauga melodie</button>
</p>

<div id="mesajEroare"></div>

<table id="tm">
  <tr>
    <th>Titlu</th>
    <th>Interpretata de</th>
    <th>Versuri</th>
    <th>Muzica</th>
    <th colspan="2" style="text-align:center">Operatii</th>
  </tr>
</table>

<div><span id="raw"></span></div>

<div class="formPopup" id="adauga">
  <form action="javascript:;" onsubmit="adaugaMelodie(this)" class="formContainer">
    <h2>Adauga melodie</h2>
    <label for="titlu"><strong>Titlu</strong></label>
    <input type="text" id="titlu" placeholder="Titlul melodiei" name="titlu" required>
    <label for="interpret"><strong>Interpret</strong></label>
    <input type="text" id="interpret" placeholder="Interpretul melodiei" name="interpret" required>
    <label for="versuri"><strong>Versuri</strong></label>
    <input type="text" id="versuri" placeholder="Autor versuri" name="versuri" required>
    <label for="muzica"><strong>Muzica</strong></label>
    <input type="text" id="muzica" placeholder="Autor muzica" name="muzica" required>
    <button type="submit" class="btn">Adauga</button>
    <button type="button" class="btn cancel" onclick="closeForm('adauga')">Close</button>
  </form>
</div>

<div class="formPopup" id="modifica">
  <form action="javascript:;" onsubmit="modificaMelodie()" class="formContainer">
    <h2>Modifica melodie</h2>
    <label for="titluM"><strong>Titlu</strong></label>
    <input type="text" id="titluM" placeholder="Titlul melodiei" name="titluM" required>
    <label for="interpretM"><strong>Interpret</strong></label>
    <input type="text" id="interpretM" placeholder="Interpretul melodiei" name="interpretM" required>
    <label for="versuriM"><strong>Versuri</strong></label>
    <input type="text" id="versuriM" placeholder="Autor versuri" name="versuriM" required>
    <label for="muzicaM"><strong>Muzica</strong></label>
    <input type="text" id="muzicaM" placeholder="Autor muzica" name="muzicaM" required>
    <button type="submit" class="btn">Modifica</button>
    <button type="button" class="btn cancel" onclick="closeForm('modifica')">Close</button>
  </form>
</div>

<script>
const CHEIE_STORAGE = "melodiiArray";
const melodii2Show = [];
let nr = -1;

function seteazaEroare(msg) {
  document.getElementById("mesajEroare").textContent = msg || "";
}

function salveazaInLocalStorage() {
  localStorage.setItem(CHEIE_STORAGE, JSON.stringify(melodii2Show));
}

function afiseazaTabel() {
  let html = "<tr><th>Titlu</th><th>Interpretata de</th><th>Versuri</th><th>Muzica</th><th colspan='2' style='text-align:center'>Operatii</th></tr>";

  for (let i = 0; i < melodii2Show.length; i++) {
    const item = melodii2Show[i];
    const mCurenta = new melodie(item.titlu, item.muzica, item.versuri, item.interpretare);
    html += mCurenta.randNou() +
      "<td><button onclick='openForm(" + i + ")'>Modificare</button></td>" +
      "<td><button onclick='stergeMelodie(" + i + ")'>Stergere</button></td></tr>";
  }

  document.getElementById("tm").innerHTML = html;
}

async function incarcaMelodiiServer(file) {
  seteazaEroare("");
  try {
    const raspuns = await fetch(file);
    if (!raspuns.ok) {
      seteazaEroare("Eroare la incarcarea fisierului '" + file + "' (cod HTTP: " + raspuns.status + ").");
      return;
    }

    const fileContent = await raspuns.text();
    document.getElementById("raw").textContent = fileContent;

    const melodiiStored = JSON.parse(fileContent);
    melodii2Show.length = 0;
    for (let i = 0; i < melodiiStored.length; i++) {
      melodii2Show.push(melodiiStored[i]);
    }

    salveazaInLocalStorage();
    afiseazaTabel();
  } catch (err) {
    seteazaEroare("Eroare la incarcarea sau parsarea datelor: " + err.message);
  }
}

function stergeMelodie(nr) {
  melodii2Show.splice(nr, 1);
  salveazaInLocalStorage();
  afiseazaTabel();
}

function adaugaMelodie(frm) {
  const mNoua = {
    titlu: frm.titlu.value,
    interpretare: frm.interpret.value,
    versuri: frm.versuri.value,
    muzica: frm.muzica.value
  };

  melodii2Show.push(mNoua);
  salveazaInLocalStorage();
  afiseazaTabel();

  frm.titlu.value = "";
  frm.interpret.value = "";
  frm.versuri.value = "";
  frm.muzica.value = "";
  closeForm("adauga");
}

function modificaMelodie() {
  if (nr < 0 || nr >= melodii2Show.length) return;

  const mMod = {
    titlu: titluM.value,
    interpretare: interpretM.value,
    versuri: versuriM.value,
    muzica: muzicaM.value
  };

  melodii2Show.splice(nr, 1, mMod);
  salveazaInLocalStorage();

  titluM.value = "";
  interpretM.value = "";
  versuriM.value = "";
  muzicaM.value = "";
  closeForm("modifica");
  afiseazaTabel();
}

function melodie(ti, mu, ve, i) {
  this.titlu = ti;
  this.muzica = mu;
  this.versuri = ve;
  this.interpretare = i;
  this.randNou = function() {
    return "<tr><td>" + this.titlu + "</td><td>" + this.interpretare + "</td><td>" + this.versuri + "</td><td>" + this.muzica + "</td>";
  };
}

function openFormA() {
  document.getElementById("adauga").style.display = "block";
}

function openForm(rand) {
  let frm = document.getElementById("modifica");
  frm.style.display = "block";
  nr = rand;
  titluM.value = melodii2Show[nr].titlu;
  interpretM.value = melodii2Show[nr].interpretare;
  versuriM.value = melodii2Show[nr].versuri;
  muzicaM.value = melodii2Show[nr].muzica;
}

function closeForm(opt) {
  document.getElementById(opt).style.display = "none";
}

window.addEventListener("DOMContentLoaded", function() {
  const salvate = localStorage.getItem(CHEIE_STORAGE);
  if (salvate) {
    try {
      const parsed = JSON.parse(salvate);
      if (Array.isArray(parsed)) {
        melodii2Show.length = 0;
        for (let i = 0; i < parsed.length; i++) {
          melodii2Show.push(parsed[i]);
        }
        afiseazaTabel();
      }
    } catch (err) {
      seteazaEroare("Datele din localStorage sunt invalide: " + err.message);
    }
  }
});
</script>
</body>
</html>
