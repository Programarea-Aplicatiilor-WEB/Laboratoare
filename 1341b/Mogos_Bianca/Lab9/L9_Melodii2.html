<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Tabel melodii 2</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
  margin-top: 20px;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}
* {
  box-sizing: border-box;
}
.formPopup {
  display: none;
  position: fixed;
  left: 45%;
  top: 5%;
  transform: translate(-50%, 5%);
  border: 3px solid #999999;
  z-index: 9;
  background-color: #fff;
}
.formContainer {
  max-width: 400px;
  padding: 20px;
}
.formContainer input[type=text]{
  width: 80%;
  padding: 15px;
  margin: 5px 0 20px 0;
  border: none;
  background: #eee;
}
#mesajEroare {
  color: red;
  font-weight: bold;
  margin-top: 10px;
}
</style>
</head>
<body onload="initPagina()">

<h1>Gestiune Melodii (Versiunea 2 - Cu LocalStorage și Tratare Erori)</h1>

<p>
  <button onclick="incarcaMelodiileDePeServer()">Incarca melodiile de pe server</button>
  <br><br>
  <button onclick="openFormA()">Adauga melodie</button>
</p>

<div id="mesajEroare"></div>

<table id="tm">
  <tr>
    <th>Titlu</th>
    <th>Interpretata de</th>
    <th>Versuri</th>
    <th>Muzica</th>
    <th colspan=2 style="text-align:center">Operatii</th>
  </tr>
</table>

<div><span id="raw"></span></div>

<div class="formPopup" id="adauga">
  <form action="javascript:;" onsubmit="adaugaMelodie(this)" class="formContainer">
    <h2>Adauga melodie</h2>
    <label for="titluA"><strong>Titlu</strong></label>
    <input type="text" id="titluA" placeholder="Titlul melodiei" name="titlu" required>
    
    <label for="interpretA"><strong>Interpret</strong></label>
    <input type="text" id="interpretA" placeholder="Nume interpret" name="interpret" required>
    
    <label for="versuriA"><strong>Versuri</strong></label>
    <input type="text" id="versuriA" placeholder="Autor versuri" name="versuri" required>
    
    <label for="muzicaA"><strong>Muzica</strong></label>
    <input type="text" id="muzicaA" placeholder="Autor muzica" name="muzica" required>
    
    <button type="submit" class="btn">Adauga</button>
    <button type="button" class="btn cancel" onclick="closeForm('adauga')">Close</button>
  </form>
</div>

<div class="formPopup" id="modifica">
  <form action="javascript:;" onsubmit="modificaMelodie()" class="formContainer">
    <h2>Modifica melodie</h2>
    <label for="titluM"><strong>Titlu</strong></label>
    <input type="text" id="titluM" placeholder="Titlul melodiei" name="titluM" required>
    
    <label for="interpretM"><strong>Interpret</strong></label>
    <input type="text" id="interpretM" placeholder="Nume interpret" name="interpretM" required>
    
    <label for="versuriM"><strong>Versuri</strong></label>
    <input type="text" id="versuriM" placeholder="Autor versuri" name="versuriM" required>
    
    <label for="muzicaM"><strong>Muzica</strong></label>
    <input type="text" id="muzicaM" placeholder="Autor muzica" name="muzicaM" required>
    
    <button type="submit" class="btn">Modifica</button>
    <button type="button" class="btn cancel" onclick="closeForm('modifica')">Close</button>
  </form>
</div>

<script>
let melodii2Show = [];
let nr = 0;

function initPagina() {
  let savedData = localStorage.getItem("melodiiArray");
  if (savedData) {
    try {
      melodii2Show = JSON.parse(savedData);
      afiseazaTabel();
    } catch (e) {
      console.error("Eroare la parsarea datelor din LocalStorage", e);
    }
  }
}

function salveazaInLocalStorage() {
  localStorage.setItem("melodiiArray", JSON.stringify(melodii2Show));
}

async function incarcaMelodiileDePeServer() {
  const containerEroare = document.getElementById("mesajEroare");
  containerEroare.innerText = ""; 

  try {
    let response = await fetch('Melodii_JSON.txt');
    
    if (!response.ok) {
      throw new Error("Eroare la încărcarea fișierului de pe server (Cod: " + response.status + ")");
    }

    let fileContent = await response.text();
    document.getElementById("raw").innerHTML = fileContent;
    
    let melodiiStored = JSON.parse(fileContent);
    
    melodii2Show = melodiiStored;
    salveazaInLocalStorage();
    
    afiseazaTabel();

  } catch (error) {
    containerEroare.innerText = "A apărut o eroare: " + error.message;
  }
}

function melodie(ti, mu, ve, i){
  this.titlu = ti;
  this.muzica = mu;
  this.versuri = ve;
  this.interpretare = i;
  this.randNou = function() {
    return "<tr><td>" + this.titlu + "</td><td>" + this.interpretare + "</td><td>" + this.versuri + "</td><td>" + this.muzica + "</td>";
  }
}

function afiseazaTabel() {
  let tabelHTML = "<tr><th>Titlu</th><th>Interpretata de</th><th>Versuri</th><th>Muzica</th><th colspan=2 style='text-align:center'>Operatii</th></tr>";
  for(let i = 0; i < melodii2Show.length; i++) {
    let m_curenta = new melodie(melodii2Show[i].titlu, melodii2Show[i].muzica, melodii2Show[i].versuri, melodii2Show[i].interpretare);
    tabelHTML += m_curenta.randNou() + "<td><button onclick='openForm("+i+")'>Modificare</button></td><td><button onclick='stergeMelodie("+i+")'>Stergere</button></td></tr>";
  }
  document.getElementById("tm").innerHTML = tabelHTML;
}

function stergeMelodie(rand){
  melodii2Show.splice(rand, 1);
  salveazaInLocalStorage();
  afiseazaTabel();
}

function adaugaMelodie(frm) {
  var mNoua = {
    titlu: frm.titlu.value,
    interpretare: frm.interpret.value,
    versuri: frm.versuri.value,
    muzica: frm.muzica.value
  };
  
  melodii2Show.push(mNoua);
  salveazaInLocalStorage();
  afiseazaTabel();
  
  frm.titlu.value = null;
  frm.interpret.value = null;
  frm.versuri.value = null;
  frm.muzica.value = null;
  closeForm('adauga');
}

function modificaMelodie(){
  var mMod = {
    titlu: document.getElementById("titluM").value,
    interpretare: document.getElementById("interpretM").value,
    versuri: document.getElementById("versuriM").value,
    muzica: document.getElementById("muzicaM").value
  };
  
  melodii2Show.splice(nr, 1, mMod);
  salveazaInLocalStorage();
  afiseazaTabel();
  
  document.getElementById("titluM").value = null;
  document.getElementById("interpretM").value = null;
  document.getElementById("versuriM").value = null;
  document.getElementById("muzicaM").value = null;
  closeForm("modifica");
}

function openFormA() {
  document.getElementById("adauga").style.display = "block";
}

function openForm(rand) {
  let frm = document.getElementById("modifica");
  frm.style.display = "block";
  nr = rand;
  document.getElementById("titluM").value = melodii2Show[nr].titlu;
  document.getElementById("interpretM").value = melodii2Show[nr].interpretare;
  document.getElementById("versuriM").value = melodii2Show[nr].versuri;
  document.getElementById("muzicaM").value = melodii2Show[nr].muzica;
}

function closeForm(opt) {
  document.getElementById(opt).style.display = "none";
}
</script>
</body>
</html>
