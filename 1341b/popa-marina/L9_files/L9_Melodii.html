<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tabel melodii</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}

* {
  box-sizing: border-box;
}

.loginPopup {
  position: relative;
  text-align: center;
  width: 100%;
}

.formPopup {
  display: none;
  position: fixed;
  left: 45%;
  top: 5%;
  transform: translate(-50%, 5%);
  border: 3px solid #999999;
  z-index: 9;
}

.formContainer {
  max-width: 400px;
  padding: 20px;
  background-color: #fff;
}

.formContainer input[type=text] {
  width: 80%;
  padding: 15px;
  margin: 5px 0 20px 0;
  border: none;
  background: #eee;
}
</style>
</head>
<body>
<h1>Melodii incarcate de pe server</h1>

<p>
  <button onclick="getAJAX('Melodii_JSON.txt')">Incarca array melodii de pe server</button>
  <br><br><br>
  <button onclick="loadTable()">Incarca tabel melodii</button>
  <br><br><br>
  <button onclick="openFormA()">Adauga melodie</button>
  <table id="tm">
    <tr>
      <th>Titlu</th>
      <th>Interpretata de</th>
      <th>Versuri</th>
      <th>Muzica</th>
      <th colspan=2 style="text-align:center">Operatii</th>
    </tr>
  </table>
</p>

<div><span id="raw"></span></div>

<div class="formPopup" id="adauga">
  <form action="javascript:;" onsubmit="adaugaMelodie(this)" class="formContainer">
    <h2>Adauga melodie</h2>
    <label for="titlu">
      <strong>Titlu</strong>
    </label>
    <input type="text" id="titlu" placeholder="Titlul melodiei" name="titlu" required>

    <label for="interpretare">
      <strong>Interpret</strong>
    </label>
    <input type="text" id="interpretare" placeholder="Interpretul melodiei" name="interpretare" required>

    <label for="versuri">
      <strong>Versuri</strong>
    </label>
    <input type="text" id="versuri" placeholder="Autorul versurilor" name="versuri" required>

    <label for="muzica">
      <strong>Muzica</strong>
    </label>
    <input type="text" id="muzica" placeholder="Compozitorul muzicii" name="muzica" required>

    <button type="submit" class="btn">Adauga</button>
    <button type="button" class="btn cancel" onclick="closeForm('adauga')">Close</button>
  </form>
</div>

<div class="formPopup" id="modifica">
  <form action="javascript:;" onsubmit="modificaMelodie()" class="formContainer">
    <h2>Modifica melodie</h2>
    <label for="titluM">
      <strong>Titlu</strong>
    </label>
    <input type="text" id="titluM" placeholder="Titlul melodiei" name="titluM" required>

    <label for="interpretareM">
      <strong>Interpret</strong>
    </label>
    <input type="text" id="interpretareM" placeholder="Interpretul melodiei" name="interpretareM" required>

    <label for="versuriM">
      <strong>Versuri</strong>
    </label>
    <input type="text" id="versuriM" placeholder="Autorul versurilor" name="versuriM" required>

    <label for="muzicaM">
      <strong>Muzica</strong>
    </label>
    <input type="text" id="muzicaM" placeholder="Compozitorul muzicii" name="muzicaM" required>

    <button type="submit" class="btn">Modifica</button>
    <button type="button" class="btn cancel" onclick="closeForm('modifica')">Close</button>
  </form>
</div>

<script>
const melodii2Show = [];
let fileContent;
let nr = 0;

async function getAJAX(file) {
  let myObject = await fetch(file);
  fileContent = await myObject.text();
}

function afiseazaTabel() {
  document.getElementById("tm").innerHTML =
    "<tr><th>Titlu</th><th>Interpretata de</th><th>Versuri</th><th>Muzica</th><th colspan=2 style='text-align:center'>Operatii</th></tr>";

  for (var i = 0; i < melodii2Show.length; i++) {
    var m_curenta = new melodie(
      melodii2Show[i].titlu,
      melodii2Show[i].muzica,
      melodii2Show[i].versuri,
      melodii2Show[i].interpretare
    );
    document.getElementById("tm").innerHTML +=
      m_curenta.randNou() +
      "<td><button onclick='openForm(" + i + ")'>Modificare</button></td>" +
      "<td><button onclick='stergeMelodie(" + i + ")'>Stergere</button></td></tr>";
  }
}

function loadTable() {
  document.getElementById("raw").innerHTML = fileContent;
  var melodiiStored = JSON.parse(fileContent);
  melodii2Show.length = 0;
  for (var i = 0; i < melodiiStored.length; i++) {
    melodii2Show.push(melodiiStored[i]);
  }
  afiseazaTabel();
}

function modificaMelodie() {
  var mMod = new melodie(
    document.getElementById("titluM").value,
    document.getElementById("muzicaM").value,
    document.getElementById("versuriM").value,
    document.getElementById("interpretareM").value
  );

  melodii2Show.splice(nr, 1, mMod);
  var myJSON = JSON.stringify(melodii2Show);
  localStorage.setItem("melodiiArray", myJSON);

  document.getElementById("titluM").value = "";
  document.getElementById("interpretareM").value = "";
  document.getElementById("versuriM").value = "";
  document.getElementById("muzicaM").value = "";

  closeForm("modifica");
  afiseazaTabel();
}

function stergeMelodie(nr) {
  melodii2Show.splice(nr, 1);
  var myJSON = JSON.stringify(melodii2Show);
  localStorage.setItem("melodiiArray", myJSON);
  afiseazaTabel();
}

function melodie(ti, mu, ve, i) {
  this.titlu = ti;
  this.muzica = mu;
  this.versuri = ve;
  this.interpretare = i;
  this.randNou = function() {
    return "<tr><td>" + this.titlu + "</td><td>" + this.interpretare + "</td><td>" + this.versuri + "</td><td>" + this.muzica + "</td>";
  };
}

function adaugaMelodie(frm) {
  var mNoua = new melodie(
    frm.titlu.value,
    frm.muzica.value,
    frm.versuri.value,
    frm.interpretare.value
  );

  melodii2Show.push(mNoua);
  var myJSON = JSON.stringify(melodii2Show);
  localStorage.setItem("melodiiArray", myJSON);

  afiseazaTabel();

  frm.titlu.value = "";
  frm.interpretare.value = "";
  frm.versuri.value = "";
  frm.muzica.value = "";

  closeForm("adauga");
}

function openFormA() {
  document.getElementById("adauga").style.display = "block";
}

function openForm(rand) {
  let frm = document.getElementById("modifica");
  frm.style.display = "block";
  nr = rand;
  document.getElementById("titluM").value = melodii2Show[nr].titlu;
  document.getElementById("interpretareM").value = melodii2Show[nr].interpretare;
  document.getElementById("versuriM").value = melodii2Show[nr].versuri;
  document.getElementById("muzicaM").value = melodii2Show[nr].muzica;
}

function closeForm(opt) {
  document.getElementById(opt).style.display = "none";
}
</script>

<!--
Exercitiul 3 L9_Melodii.html:

1. Ce este deja adaptat la melodii:
- Titlul paginii ("Tabel melodii"), heading-ul <h1> ("Melodii incarcate de pe server") si primele 
  doua butoane (getAJAX('Melodii_JSON.txt') si loadTable()).
- Antetul tabelului cu cele 4 coloane ale melodiilor (Titlu, Interpretata de, Versuri, Muzica) si coloana Operații.
- Tabloul global const melodii2Show = [];.
- Constructorul melodie(ti, mu, ve, i) si metoda randNou(), care returneaza celulele in ordinea din 
antet (titlu, interpretare, versuri, muzica).
- Functia loadTable(), care citeste JSON-ul, instantiaza obiecte de tip melodie pentru afisare si adauga melodiile in melodii2Show.

2. Ce NU este adaptat (ramas de la exemplul cu masini):
- Butonul "Adauga masina" si cele doua formulare pop-up (#adauga si #modifica), care au doar 3 campuri
 (marca, model, culoare) in loc de 4 (titlu, interpretare, versuri, muzica).
- Functiile stergeMasina(), modificaMasina(), adaugaMasina() si openForm(), care folosesc inca tabloul 
inexistent masini2Show, constructorul inexistent masina, cheia carsArray din Local Storage si antetul tabelului 
de masini (Marca, Model, Culoare).

3. Erorile care apar in consola (F12 -> Console) la fiecare operatie:
- Stergere: Uncaught ReferenceError: masini2Show is not defined (in functia stergeMasina, la apelul masini2Show.splice(nr, 1)).
- Modificare: Uncaught ReferenceError: masini2Show is not defined (in functia openForm, 
la accesarea masini2Show[nr].marca; la trimiterea formularului, modificaMasina ar da Uncaught ReferenceError: masina is not defined).
- Adaugare: Uncaught ReferenceError: masina is not defined (in functia adaugaMasina, la apelul new masina(...)).
-->
</body>
</html>
