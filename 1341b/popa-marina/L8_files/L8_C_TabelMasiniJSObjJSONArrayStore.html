<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tabel masini - L8_C</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}

#mesaj {
  color: red;
  font-weight: bold;
}
</style>
</head>
<body>
<h1>Masinile dorite</h1>

<form onsubmit="return adaugaMasina()">
  <input id="marca" placeholder="Marca" required>
  <input id="model" placeholder="Model" required>
  <input id="culoare" placeholder="Culoare" required>
  <input id="anFab" type="number" placeholder="An fabricatie" required>
  <button type="submit">Adauga masina</button>
</form>

<p id="mesaj"></p>

<table id="tm">
  <tr>
    <th>Marca</th>
    <th>Model</th>
    <th>Culoare</th>
    <th>An fabricatie</th>
  </tr>
</table>

<script>
const masini2Store = [];

if (localStorage.carsArray) {
  let arrayJSON = localStorage.carsArray;
  var masiniStored = JSON.parse(arrayJSON);
  for (var i = 0; i < masiniStored.length; i++) {
    document.getElementById("tm").innerHTML += masiniStored[i].randNou;
    masini2Store.push(masiniStored[i]);
  }
}

function masina(mk, md, cl, an) {
  this.marca = mk;
  this.model = md;
  this.culoare = cl;
  this.anFab = an;
  this.randNou = function() {
    return "<tr><td>" + this.marca + "</td><td>" + this.model + "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>";
  };
}

function valideaza(marca, model, culoare, an) {
  var anCurent = new Date().getFullYear();

  if (marca === "" || model === "" || culoare === "") {
    return "Marca, modelul si culoarea nu pot fi goale sau formate doar din spatii.";
  }

  if (!Number.isInteger(an) || an < 1900 || an > anCurent) {
    return "Anul fabricatiei trebuie sa fie un numar intreg intre 1900 si " + anCurent + ".";
  }

  return "";
}

function adaugaMasina() {
  var marca = document.getElementById("marca").value.trim();
  var model = document.getElementById("model").value.trim();
  var culoare = document.getElementById("culoare").value.trim();
  var an = Number(document.getElementById("anFab").value);

  var eroare = valideaza(marca, model, culoare, an);
  if (eroare !== "") {
    document.getElementById("mesaj").textContent = eroare;
    return false;
  }

  document.getElementById("mesaj").textContent = "";

  var mNoua = new masina(marca, model, culoare, an);
  document.getElementById("tm").innerHTML += mNoua.randNou();

  mNoua.randNou = mNoua.randNou().toString();
  masini2Store.push(mNoua);
  var myJSON = JSON.stringify(masini2Store);
  localStorage.setItem("carsArray", myJSON);

  return false;
}
</script>

<!--
Exercitiul 6:
Fata de L8_B (care retine un singur obiect si il suprascrie la fiecare adaugare), L8_C aduce urmatoarele noutati:
1. Tabloul masini2Store: pastreaza in memorie toate obiectele masina adaugate in sesiunea curenta, adaugand 
fiecare obiect nou la finalul listei cu metoda push(), fara a le suprascrie pe cele anterioare.
2. Cheia carsArray din Local Storage: salveaza intregul tablou masini2Store serializat ca sir JSON 
(un array de obiecte), astfel incat toate masinile adaugate sa persiste intre reincarcari.
3. Bucla for de la incarcarea paginii: parcurge tabloul masiniStored (obtinut cu JSON.parse din localStorage.carsArray),
 afiseaza in tabel randul HTML al fiecarei masini in ordinea adaugarii si reintroduce fiecare obiect in masini2Store, pentru ca
  adaugarile viitoare sa continue lista existenta fara sa stearga masinile vechi.
-->
</body>
</html>
