<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Laborator 6 - Exercitiul 4</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            cursor: pointer;
            display: inline-block;
            transition: color 0.2s ease;
        }

        p {
            cursor: pointer;
            padding: 15px;
            font-size: 16px;
            line-height: 1.6;
            border: 1px dashed #999;
            width: fit-content;
            transition: background-color 0.2s ease;
        }
    </style>
</head>
<body>

    <h1 id="titlu">Titlu pentru test</h1>

    <p id="paragraf">
        Prima linie<br>
        A doua linie<br>
        A treia linie
    </p>

    <script>
        var titlu = document.getElementById("titlu");
        var paragraf = document.getElementById("paragraf");

        titlu.onclick = function () {
            var culoare = prompt("Introduceți o culoare pentru textul titlului:");

            if (culoare !== null && culoare.trim() !== "") {
                if (CSS.supports("color", culoare)) {
                    this.style.color = culoare;
                } else {
                    alert("Culoare invalida!");
                }
            }
        };

        paragraf.onclick = function () {
            var culoare = prompt("Introduceți o culoare de fundal pentru paragraf:");

            if (culoare !== null && culoare.trim() !== "") {
                if (CSS.supports("color", culoare)) {
                    this.style.backgroundColor = culoare;
                } else {
                    alert("Culoarea invalida!");
                }
            }
        };
    </script>

</body>
</html>
