<!DOCTYPE html>
<html lang="ro">

<head>
  <meta charset="UTF-8">
  <title>Tabel melodii – cu păstrarea modificărilor</title>
  <style>
    table {
      font-family: arial, sans-serif;
      border-collapse: collapse;
      width: 100%;
    }

    td,
    th {
      border: 1px solid #dddddd;
      text-align: left;
      padding: 8px;
    }

    * {
      box-sizing: border-box;
    }

    .loginPopup {
      position: relative;
      text-align: center;
      width: 100%;
    }

    .formPopup {
      display: none;
      position: fixed;
      left: 45%;
      top: 5%;
      transform: translate(-50%, 5%);
      border: 3px solid #999999;
      z-index: 9;
    }

    .formContainer {
      max-width: 400px;
      width: 360px;
      padding: 20px;
      background-color: #fff;
    }

    .formContainer label {
      display: block;
    }

    .formContainer input[type=text] {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 5px 0 15px 0;
      border: none;
      background: #eee;
    }

    #mesajEroare {
      color: red;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h1>Melodii incarcate de pe server (cu pastrarea modificarilor)</h1>

  <p>
    <button onclick="incarcaMelodii('Melodii_JSON.txt')">Incarca melodiile de pe server</button>
    <br><br>
    <button onclick="openFormA()">Adauga melodie</button>
  </p>

  <p id="mesajEroare"></p>

  <table id="tm">
    <tr>
      <th>Titlu</th>
      <th>Interpretata de</th>
      <th>Versuri</th>
      <th>Muzica</th>
      <th colspan=2 style="text-align:center">Operatii</th>
    </tr>
  </table>

  <div><span id="raw"> </span></div>

  <div class="formPopup" id="adauga">
    <form action="javascript:;" onsubmit="adaugaMelodie(this)" class="formContainer">
      <h2>Adauga melodie</h2>
      <label for="titlu">
        <strong>Titlu</strong>
      </label>
      <input type="text" id="titlu" placeholder="Titlul melodiei" name="titlu" required>
      <label for="interpret">
        <strong>Interpret</strong>
      </label>
      <input type="text" id="interpret" placeholder="Interpretul melodiei" name="interpret" required>
      <label for="versuri">
        <strong>Versuri</strong>
      </label>
      <input type="text" id="versuri" placeholder="Autorul versurilor" name="versuri" required>
      <label for="muzica">
        <strong>Muzica</strong>
      </label>
      <input type="text" id="muzica" placeholder="Autorul muzicii" name="muzica" required>
      <button type="submit" class="btn">Adauga</button>
      <button type="button" class="btn cancel" onclick="closeForm('adauga')">Close</button>
    </form>
  </div>

  <div class="formPopup" id="modifica">
    <form action="javascript:;" onsubmit="modificaMelodie()" class="formContainer">
      <h2>Modifica melodie</h2>
      <label for="titluM">
        <strong>Titlu</strong>
      </label>
      <input type="text" id="titluM" placeholder="Titlul melodiei" name="titluM" required>
      <label for="interpretM">
        <strong>Interpret</strong>
      </label>
      <input type="text" id="interpretM" placeholder="Interpretul melodiei" name="interpretM" required>
      <label for="versuriM">
        <strong>Versuri</strong>
      </label>
      <input type="text" id="versuriM" placeholder="Autorul versurilor" name="versuriM" required>
      <label for="muzicaM">
        <strong>Muzica</strong>
      </label>
      <input type="text" id="muzicaM" placeholder="Autorul muzicii" name="muzicaM" required>
      <button type="submit" class="btn">Modifica</button>
      <button type="button" class="btn cancel" onclick="closeForm('modifica')">Close</button>
    </form>
  </div>

  <script>
    const melodii2Show = [];
    let fileContent;
    let nr = 0;

    function melodie(ti, mu, ve, i) {
      this.titlu = ti;
      this.muzica = mu;
      this.versuri = ve;
      this.interpretare = i;
      this.randNou = function () {
        return "<tr><td>" + this.titlu + "</td><td>" + this.interpretare + "</td><td>" + this.versuri + "</td><td>" + this.muzica + "</td>";
      };
    }

    function salveazaInLocalStorage() {
      var myJSON = JSON.stringify(melodii2Show);
      localStorage.setItem("melodiiArray", myJSON);
    }

    function afiseazaTabel() {
      var tabel = document.getElementById("tm");
      tabel.innerHTML = "<tr><th>Titlu</th><th>Interpretata de</th><th>Versuri</th><th>Muzica</th><th colspan=2 style='text-align:center'>Operatii</th></tr>";
      for (var i = 0; i < melodii2Show.length; i++) {
        var m_curenta = new melodie(
          melodii2Show[i].titlu,
          melodii2Show[i].muzica,
          melodii2Show[i].versuri,
          melodii2Show[i].interpretare
        );
        tabel.innerHTML += m_curenta.randNou() +
          "<td><button onclick='openForm(" + i + ")'>Modificare</button></td>" +
          "<td><button onclick='stergeMelodie(" + i + ")'>Stergere</button></td></tr>";
      }
    }

    async function incarcaMelodii(file) {
      var mesajEroare = document.getElementById("mesajEroare");
      mesajEroare.textContent = "";
      try {
        let raspuns = await fetch(file);
        if (!raspuns.ok) {
          throw new Error("Fisierul '" + file + "' nu a putut fi incarcat (cod " + raspuns.status + ").");
        }
        fileContent = await raspuns.text();
        document.getElementById("raw").textContent = fileContent;
        var melodiiStored = JSON.parse(fileContent);
        melodii2Show.length = 0;
        for (var i = 0; i < melodiiStored.length; i++) {
          melodii2Show.push(melodiiStored[i]);
        }
        salveazaInLocalStorage();
        afiseazaTabel();
      } catch (e) {
        mesajEroare.textContent = "Eroare la incarcare: " + e.message;
      }
    }

    function incarcaDinLocalStorage() {
      var salvate = localStorage.getItem("melodiiArray");
      if (salvate) {
        try {
          var melodiiStored = JSON.parse(salvate);
          melodii2Show.length = 0;
          for (var i = 0; i < melodiiStored.length; i++) {
            melodii2Show.push(melodiiStored[i]);
          }
          afiseazaTabel();
        } catch (e) {
          document.getElementById("mesajEroare").textContent = "Eroare la citirea din Local Storage: " + e.message;
        }
      }
    }

    function adaugaMelodie(frm) {
      var mNoua = new melodie(frm.titlu.value, frm.muzica.value, frm.versuri.value, frm.interpret.value);
      melodii2Show.push(mNoua);
      salveazaInLocalStorage();
      afiseazaTabel();
      frm.titlu.value = "";
      frm.interpret.value = "";
      frm.versuri.value = "";
      frm.muzica.value = "";
      closeForm("adauga");
    }

    function modificaMelodie() {
      var mMod = new melodie(
        document.getElementById("titluM").value,
        document.getElementById("muzicaM").value,
        document.getElementById("versuriM").value,
        document.getElementById("interpretM").value
      );
      melodii2Show.splice(nr, 1, mMod);
      salveazaInLocalStorage();
      document.getElementById("titluM").value = "";
      document.getElementById("interpretM").value = "";
      document.getElementById("versuriM").value = "";
      document.getElementById("muzicaM").value = "";
      closeForm("modifica");
      afiseazaTabel();
    }

    function stergeMelodie(nr) {
      melodii2Show.splice(nr, 1);
      salveazaInLocalStorage();
      afiseazaTabel();
    }

    function openFormA() {
      document.getElementById("adauga").style.display = "block";
    }

    function openForm(rand) {
      let frm = document.getElementById("modifica");
      frm.style.display = "block";
      nr = rand;
      document.getElementById("titluM").value = melodii2Show[nr].titlu;
      document.getElementById("interpretM").value = melodii2Show[nr].interpretare;
      document.getElementById("versuriM").value = melodii2Show[nr].versuri;
      document.getElementById("muzicaM").value = melodii2Show[nr].muzica;
    }

    function closeForm(opt) {
      document.getElementById(opt).style.display = "none";
    }

    incarcaDinLocalStorage();
  </script>
</body>

</html>
