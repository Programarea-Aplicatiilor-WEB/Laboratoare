<!DOCTYPE html>
<html>
<head>
<title>Tabel masini</title>
<style>
table { font-family: arial, sans-serif; border-collapse: collapse; width: 100%; }
td, th { border: 1px solid #dddddd; text-align: left; padding: 8px; }
</style>
</head>
<body>
<h1>Masinile dorite</h1>

<form onsubmit="return adaugaMasina()" novalidate>
  <input id="marca" placeholder="Marca" required>
  <input id="model" placeholder="Model" required>
  <input id="culoare" placeholder="Culoare" required>
  <input id="anFab" type="number" placeholder="An fabricatie" required>
  <button type="submit">Adauga masina</button>
</form>

<p id="mesaj" style="color: red;"></p>

<table id="tm">
  <tr>
    <th>Marca</th>
    <th>Model</th>
    <th>Culoare</th>
    <th>An fabricatie</th>
  </tr>
</table>

<script>
const masini2Store = [];

if (localStorage.carsArray) {
  var masiniStored = JSON.parse(localStorage.carsArray);
  for (var i = 0; i < masiniStored.length; i++) {
    document.getElementById("tm").innerHTML += masiniStored[i].randNou;
    masini2Store.push(masiniStored[i]);
  }
}

function masina(mk, md, cl, an) {
  this.marca = mk;
  this.model = md;
  this.culoare = cl;
  this.anFab = an;
  this.randNou = function() {
    return "<tr><td>" + this.marca + "</td><td>" + this.model + "</td><td>" + this.culoare + "</td><td>" + this.anFab + "</td></tr>";
  };
}

function valideaza(marca, model, culoare, an) {
  var anCurent = new Date().getFullYear();

  if (!marca || marca.trim() == "") return "Marca nu poate fi goala.";
  if (!model || model.trim() == "") return "Modelul nu poate fi gol.";
  if (!culoare || culoare.trim() == "") return "Culoarea nu poate fi goala.";

  var anNum = Number(an);
  if (!an || String(an).trim() == "" || !Number.isInteger(anNum) || anNum < 1900 || anNum > anCurent) {
    return "Anul trebuie sa fie un numar intreg intre 1900 si " + anCurent + ".";
  }

  return "";
}

function adaugaMasina() {
  var marca = document.getElementById("marca").value;
  var model = document.getElementById("model").value;
  var culoare = document.getElementById("culoare").value;
  var an = document.getElementById("anFab").value;

  var eroare = valideaza(marca, model, culoare, an);
  if (eroare != "") {
    document.getElementById("mesaj").innerHTML = eroare;
    return false;
  }

  document.getElementById("mesaj").innerHTML = "";

  var mNoua = new masina(marca, model, culoare, an);
  document.getElementById("tm").innerHTML += mNoua.randNou();

  mNoua.randNou = mNoua.randNou().toString();
  masini2Store.push(mNoua);
  localStorage.setItem("carsArray", JSON.stringify(masini2Store));

  return false;
}

/*
Ce este nou in L8_C fata de L8_B:
1. masini2Store: o lista (array) in care se pun toate masinile, una dupa alta.
2. carsArray: cheia din localStorage unde se salveaza toata lista ca text JSON.
3. Bucla for: la incarcarea paginii, citeste lista salvata, afiseaza fiecare masina in tabel si o pune inapoi in masini2Store ca sa nu se piarda.
*/

</script>
</body>
</html>
