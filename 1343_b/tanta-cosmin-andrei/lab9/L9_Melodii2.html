<!DOCTYPE html>
<html>
<head>
<title>Melodii incarcate de pe server</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}
 * {
        box-sizing: border-box;
      }
.loginPopup {
        position: relative;
        text-align: center;
        width: 100%;
      }
      .formPopup {
        display: none;
        position: fixed;
        left: 45%;
        top: 5%;
        transform: translate(-50%, 5%);
        border: 3px solid #999999;
        z-index: 9;
      }
	        .formContainer {
        max-width: 400px;
        padding: 20px;
        background-color: #fff;
      }
	        .formContainer input[type=text]{
        width: 80%;
        padding: 15px;
        margin: 5px 0 20px 0;
        border: none;
        background: #eee;
      }
</style>
</head>
<body>
<h1 > Melodii incarcate de pe server </h1>

<p>

<button onclick="incarcaMelodiile()";>Incarca melodiile de pe server</button>
<br>
<div id="mesajEroare" style="color:red"></div>
<br>
<button onclick="openFormA()";> Adauga melodie</button>
<br><br>
<table id="tm">
<tr>
    <th>Titlu</th>
    <th>Interpretata de</th>
    <th>Versuri</th>
    <th>Muzica</th>
	<th colspan=2 style="text-align:center">Operatii</th>
  </tr>

</table>
</p>
<div><span id="raw"> </span></div>
<div class="formPopup" id="adauga">
        <form action="javascript:;" onsubmit="adaugaMelodie(this)" class="formContainer">
          <h2>Adauga melodie</h2>
          <label for="titlu">
            <strong>Titlu</strong>
          </label>
          <input type="text" id="titlu" placeholder="Titlul melodiei" name="titlu" required>
          <label for="interpretare">
            <strong>Interpret</strong>
          </label>
          <input type="text" id="interpretare" placeholder="Interpretul melodiei" name="interpretare" required>
		  <label for="versuri">
            <strong>Versuri</strong>
          </label>
          <input type="text" id="versuri" placeholder="Autorul versurilor" name="versuri" required>
          <label for="muzica">
            <strong>Muzica</strong>
          </label>
          <input type="text" id="muzica" placeholder="Autorul muzicii" name="muzica" required>
          <button type="submit" class="btn">Adauga</button>
          <button type="button" class="btn cancel" onclick="closeForm('adauga')">Close</button>
        </form>
      </div>
	  <div class="formPopup" id="modifica">
        <form action="javascript:;" onsubmit="modificaMelodie()" class="formContainer">
          <h2>Modifica melodie</h2>
          <label for="titluM">
            <strong>Titlu</strong>
          </label>
          <input type="text" id="titluM" placeholder="Titlul melodiei" name="titluM" required>
          <label for="interpretareM">
            <strong>Interpret</strong>
          </label>
          <input type="text" id="interpretareM" placeholder="Interpretul melodiei" name="interpretareM" required>
		  <label for="versuriM">
            <strong>Versuri</strong>
          </label>
          <input type="text" id="versuriM" placeholder="Autorul versurilor" name="versuriM" required>
          <label for="muzicaM">
            <strong>Muzica</strong>
          </label>
          <input type="text" id="muzicaM" placeholder="Autorul muzicii" name="muzicaM" required>
          <button type="submit" class="btn">Modifica</button>
          <button type="button" class="btn cancel" onclick="closeForm('modifica')">Close</button>
        </form>
      </div>
<script>
const melodii2Show = [];
let fileContent;
let row = 0;

async function incarcaMelodiile(){
  document.getElementById("mesajEroare").innerHTML = "";
  try{
    let myObject = await fetch("Melodii_JSON.txt");
    if(!myObject.ok){
      document.getElementById("mesajEroare").innerHTML =
        "Eroare la incarcare: fisierul Melodii_JSON.txt nu a fost gasit (" +
        myObject.status + ").";
      return;
    }
    fileContent = await myObject.text();
    document.getElementById("raw").innerHTML=fileContent;
    var melodiiStored = JSON.parse(fileContent);
    for(i=melodii2Show.length-1; i >= 0; i--){
      if(melodii2Show[i].dinServer){
        melodii2Show.splice(i, 1);
      }
    }
    for(i=0; i < melodiiStored.length ; i++){
      var melServer = {
        titlu: melodiiStored[i].titlu,
        muzica: melodiiStored[i].muzica,
        versuri: melodiiStored[i].versuri,
        interpretare: melodiiStored[i].interpretare,
        dinServer: true
      };
      melodii2Show.push(melServer);
    }
    var myJSON = JSON.stringify(melodii2Show);
    localStorage.setItem("melodiiArrayBonus", myJSON);
    afiseazaTabel();
  }
  catch(error){
    document.getElementById("mesajEroare").innerHTML =
      "Eroare la incarcare: " + error.message;
  }
}

function afiseazaTabel(){

document.getElementById("tm").innerHTML = "<tr><th>Titlu</th><th>Interpretata de</th><th>Versuri</th><th>Muzica</th><th colspan=2 style='text-align:center'>Operatii</th></tr>";
for(i=0; i < melodii2Show.length ; i++){

var m_curenta = new melodie(melodii2Show[i].titlu, melodii2Show[i].muzica, melodii2Show[i].versuri, melodii2Show[i].interpretare);
document.getElementById("tm").innerHTML += m_curenta.randNou()+ "<td><button onclick='openForm("+i+")';>Modificare</button></td><td><button onclick='stergeMelodie("+i+")';>Stergere</button></td></tr>";
}

}

function modificaMelodie(){

var melMod = new melodie(titluM.value, muzicaM.value, versuriM.value, interpretareM.value);

  melMod.dinServer = true;
}
melodii2Show.splice(nr, 1, melMod);
var myJSON = JSON.stringify(melodii2Show);
localStorage.setItem("melodiiArrayBonus", myJSON);
titluM.value =null;
interpretareM.value = null;
versuriM.value = null;
muzicaM.value = null;
closeForm("modifica");
afiseazaTabel();

}

function stergeMelodie(nr){
melodii2Show.splice(nr, 1);
var myJSON = JSON.stringify(melodii2Show);
localStorage.setItem("melodiiArrayBonus", myJSON);

function melodie(ti, mu, ve, i){
// titlu, muzica, versuri, interpretare
this.titlu= ti;
this.muzica = mu;
this.versuri = ve;
this.interpretare = i;
this.randNou = function() {return "<tr><td>" + this.titlu +"</td><td>" + this.interpretare + "</td><td>" + this.versuri +"</td><td>" + this.muzica + "</td>"}
}

function adaugaMelodie(frm) {

var mNoua = new melodie(frm.titlu.value, frm.muzica.value, frm.versuri.value, frm.interpretare.value);

document.getElementById("tm").innerHTML += mNoua.randNou() + "<td><button onclick='openForm("+ melodii2Show.length +")';>Modificare</button></td><td><button onclick='stergeMelodie("+melodii2Show.length+")';>Stergere</button></td></tr>";

mNoua.randNou = 	mNoua.randNou().toString();
melodii2Show.push(mNoua);
var myJSON = JSON.stringify(melodii2Show);
localStorage.setItem("melodiiArrayBonus", myJSON);
frm.titlu.value = null;
frm.muzica.value = null;
frm.versuri.value = null;
frm.interpretare.value = null;
closeForm("adauga");

}
      function openFormA() {
        document.getElementById("adauga").style.display = "block";
      }
	        function openForm(rand) {
        let frm = document.getElementById("modifica");
		frm.style.display = "block";
		nr = rand;
		titluM.value = melodii2Show[nr].titlu;
		interpretareM.value = melodii2Show[nr].interpretare;
		versuriM.value = melodii2Show[nr].versuri;
		muzicaM.value = melodii2Show[nr].muzica;
      }
      function closeForm(opt) {
        document.getElementById(opt).style.display = "none";
      }

var melodiiSalvate = localStorage.getItem("melodiiArrayBonus");
if(melodiiSalvate != null){
  try{
    var melodiiStored = JSON.parse(melodiiSalvate);
    for(i=0; i < melodiiStored.length ; i++){
      melodii2Show.push(melodiiStored[i]);
    }
  }
  catch(error){
    document.getElementById("mesajEroare").innerHTML =
      "Eroare la citirea melodiilor salvate.";
  }
}
afiseazaTabel();

</script>
</body>
</html>
