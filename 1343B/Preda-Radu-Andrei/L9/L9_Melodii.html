<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tabel melodii</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}
* {
  box-sizing: border-box;
}
.loginPopup {
  position: relative;
  text-align: center;
  width: 100%;
}
.formPopup {
  display: none;
  position: fixed;
  left: 45%;
  top: 5%;
  border: 1px solid black;
  background: white;
  padding: 10px;
  z-index: 9;
}
.formContainer input[type=text]{
  width: 100%;
  margin: 5px 0;
}
</style>
</head>
<body>

<h1>Melodii incarcate de pe server</h1>

<p>
  <button onclick="getAJAX('Melodii_JSON.txt')">Incarca array melodii de pe server</button>
  <br><br>
  <button onclick="loadTable()">Incarca tabel melodii</button>
  <br><br>
  <button onclick="openAddForm()">Adauga melodia noua</button>
  <br><br>
  
  <table id="tm">
    <tr>
      <th>Titlu</th>
      <th>Interpretata de</th>
      <th>Versuri</th>
      <th>Muzica</th>
      <th colspan=2 style="text-align:center">Operatii</th>
    </tr>
  </table>
</p>

<div class="formPopup" id="popupForm">
  <form class="formContainer">
    <h2>Modifica melodia</h2>
    <input type="hidden" id="editIndex">

    <label>Titlu</label>
    <input type="text" id="editTitlu"><br>

    <label>Interpretata de</label>
    <input type="text" id="editInterpret"><br>

    <label>Versuri</label>
    <input type="text" id="editVersuri"><br>

    <label>Muzica</label>
    <input type="text" id="editMuzica"><br>

    <button type="button" onclick="salveazaModificarea()">Salveaza</button>
    <button type="button" onclick="closeForm()">Inchide</button>
  </form>
</div>

<div class="formPopup" id="popupAddForm">
  <form class="formContainer">
    <h2>Adauga melodie nou</h2>
    <input type="hidden" id="editIndex">

    <label>Titlu</label>
    <input type="text" id="addTitlu"><br>

    <label>Interpretata de</label>
    <input type="text" id="addInterpret"><br>

    <label>Versuri</label>
    <input type="text" id="addVersuri"><br>

    <label>Muzica</label>
    <input type="text" id="addMuzica"><br>

    <button type="button" onclick="adaugaMelodie()">Adauga</button>
    <button type="button" onclick="closeAddForm()">Inchide</button>
  </form>
</div>


<div><span id="raw"></span></div>

<script>
const melodii2Show = [];
let fileContent;

async function getAJAX(file) {
  let myObject = await fetch(file);
  fileContent = await myObject.text();
}

function melodie(ti, mu, ve, i) {
  this.titlu = ti;
  this.muzica = mu;
  this.versuri = ve;
  this.interpretare = i;
  this.randNou = function() {
    return "<tr><td>" + this.titlu + "</td><td>" + this.interpretare + "</td><td>" + this.versuri + "</td><td>" + this.muzica + "</td>";
  }
}

function afiseazaTabel() {
  let html = `<tr>
    <th>Titlu</th>
    <th>Interpretata de</th>
    <th>Versuri</th>
    <th>Muzica</th>
    <th colspan=2 style="text-align:center">Operatii</th>
  </tr>`;

  for (let i = 0; i < melodii2Show.length; i++) {
    html += melodii2Show[i].randNou() + 
            "<td><button onclick='openForm(" + i + ")'>Modificare</button></td>" + 
            "<td><button onclick='stergeMelodie(" + i + ")'>Stergere</button></td></tr>";
  }

  document.getElementById("tm").innerHTML = html;
}

function loadTable() {
  if (!fileContent) {
    alert("Mai întâi încarcă array-ul de pe server!");
    return;
  }
  
  document.getElementById("raw").innerHTML = fileContent;
  var melodiiStored = JSON.parse(fileContent);
  
  melodii2Show.length = 0;

  for (let i = 0; i < melodiiStored.length; i++) {
    var m_curenta = new melodie(
      melodiiStored[i].titlu, 
      melodiiStored[i].muzica, 
      melodiiStored[i].versuri, 
      melodiiStored[i].interpretare
    );
    melodii2Show.push(m_curenta);
  }

  afiseazaTabel();
}

function stergeMelodie(nr) {
  melodii2Show.splice(nr, 1);
  afiseazaTabel();
}

function openForm(rand) {
  document.getElementById("popupForm").style.display = "block";
  document.getElementById("editIndex").value = rand;
  document.getElementById("editTitlu").value = melodii2Show[rand].titlu;
  document.getElementById("editInterpret").value = melodii2Show[rand].interpretare;
  document.getElementById("editVersuri").value = melodii2Show[rand].versuri;
  document.getElementById("editMuzica").value = melodii2Show[rand].muzica;
}

function closeForm() {
  document.getElementById("popupForm").style.display = "none";
}

function salveazaModificarea() {
  let rand = document.getElementById("editIndex").value;
  
  melodii2Show[rand].titlu = document.getElementById("editTitlu").value;
  melodii2Show[rand].interpretare = document.getElementById("editInterpret").value;
  melodii2Show[rand].versuri = document.getElementById("editVersuri").value;
  melodii2Show[rand].muzica = document.getElementById("editMuzica").value;
  
  closeForm();
  afiseazaTabel();
}

function openAddForm() {
  document.getElementById("popupAddForm").style.display = "block";

}

function closeAddForm(){
document.getElementById("popupAddForm").style.display = "none";
document.getElementById("addTitlu").value = "";
document.getElementById("addInterpret").value = "";
document.getElementById("addVersuri").value = "";
document.getElementById("addMuzica").value = "";

}

function adaugaMelodie(){
let titlu = document.getElementById("addTitlu").value;
let interpret = document.getElementById("addInterpret").value;
let versuri = document.getElementById("addVersuri").value;
let muzica = document.getElementById("addMuzica").value;

if (!titlu || !interpret) {
    alert("Compleaza cel putin titlul si interpretul");
    return;
 }

let melodieNoua = new melodie(titlu, muzica, versuri, interpret);

melodii2Show.push(melodieNoua);
afiseazaTabel();
closeAddForm();

}

</script>

</body>
</html>
