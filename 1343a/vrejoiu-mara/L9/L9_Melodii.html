<!DOCTYPE html>
<html>
<head>
<title>Tabel melodii</title>
<style>
table {
  font-family: arial, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #dddddd;
  text-align: left;
  padding: 8px;
}
* {
        box-sizing: border-box;
      }
.loginPopup {
        position: relative;
        text-align: center;
        width: 100%;
      }
      .formPopup {
        display: none;
        position: fixed;
        left: 45%;
        top: 5%;
        transform: translate(-50%, 5%);
        border: 3px solid #999999;
        z-index: 9;
      }
	        .formContainer {
        max-width: 420px;
        padding: 20px;
        background-color: #fff;
      }
	        .formContainer label {
        display: inline-block;
        width: 110px;
        margin-right: 8px;
      }
	        .formContainer input[type=text]{
        display: inline-block;
        width: 220px;
        padding: 12px;
        margin: 5px 0 16px 0;
        border: none;
        background: #eee;
      }
</style>
</head>
<body>
<h1 > Melodii incarcate de pe server </h1>

<p>

<button onclick="getAJAX('Melodii_JSON.txt')";>Incarca array melodii de pe server</button>
<br>
<br><br>
<button onclick="loadTable()";> Incarca tabel melodii</button>
<br>
<br><br>
<button onclick="openFormA()";> Adauga melodie</button>
<table id="tm">
<tr>
    <th>Titlu</th>
	<th>Interpretata de</th>
    <th>Versuri</th>
    <th>Muzica</th>
	<th colspan=2 style="text-align:center">Operatii</th>
  </tr>
  
</table>
</p>
<div><span id="raw"> </span></div>
<div class="formPopup" id="adauga">
        <form action="javascript:;" onsubmit="adaugaMelodie(this)" class="formContainer">
          <h2>Adauga melodie</h2>
          <label for="titlu">
            <strong>Titlu</strong>
          </label>
          <input type="text" id="titlu" placeholder="Titlul melodiei" name="titlu" required>
          <br>
          <label for="interpret">
            <strong>Interpretata de</strong>
          </label>
          <input type="text" id="interpret" placeholder="Interpretul melodiei" name="interpret" required>
          <br>
          <label for="versuri">
            <strong>Versuri</strong>
          </label>
          <input type="text" id="versuri" placeholder="Versuri" name="versuri" required>
          <br>
          <label for="muzica">
            <strong>Muzica</strong>
          </label>
          <input type="text" id="muzica" placeholder="Muzica" name="muzica" required>
          <br>
          <button type="submit" class="btn">Adauga</button>
          <button type="button" class="btn cancel" onclick="closeForm('adauga')">Close</button>
        </form>
      </div>
	  <div class="formPopup" id="modifica">
        <form action="javascript:;" onsubmit="modificaMelodie()" class="formContainer">
          <h2>Modifica melodie</h2>
          <label for="titluM">
            <strong>Titlu</strong>
          </label>
          <input type="text" id="titluM" placeholder="Titlul melodiei" name="titluM" required>
          <br>
          <label for="interpretM">
            <strong>Interpretata de</strong>
          </label>
          <input type="text" id="interpretM" placeholder="Interpretul melodiei" name="interpretM" required>
          <br>
          <label for="versuriM">
            <strong>Versuri</strong>
          </label>
          <input type="text" id="versuriM" placeholder="Versuri" name="versuriM" required>
          <br>
          <label for="muzicaM">
            <strong>Muzica</strong>
          </label>
          <input type="text" id="muzicaM" placeholder="Muzica" name="muzicaM" required>
          <br>
          <button type="submit" class="btn">Modifica</button>
          <button type="button" class="btn cancel" onclick="closeForm('modifica')">Close</button>
        </form>
      </div>
<script>
const melodii2Show = [];
let fileContent;
let row = 0;
let nr = 0;
async function getAJAX(file) {
  let myObject = await fetch(file);
  fileContent = await myObject.text();

}

function afiseazaTabel() {
  document.getElementById("tm").innerHTML = "<tr><th>Titlu</th><th>Interpretata de</th><th>Versuri</th><th>Muzica</th><th colspan=2 style='text-align:center'>Operatii</th></tr>";
  for (let i = 0; i < melodii2Show.length; i++) {
    let m_curenta = new melodie(melodii2Show[i].titlu, melodii2Show[i].muzica, melodii2Show[i].versuri, melodii2Show[i].interpretare);
    document.getElementById("tm").innerHTML += m_curenta.randNou() + "<td><button onclick='openForm(" + i + ")';>Modificare</button></td><td><button onclick='stergeMelodie(" + i + ")';>Stergere</button></td></tr>";
  }
}

function loadTable(){
if (!fileContent) {
  return;
}
document.getElementById("raw").innerHTML=fileContent;
var melodiiStored = JSON.parse(fileContent);
melodii2Show.length = 0;
for(let i = 0; i < melodiiStored.length ; i++){
melodii2Show.push(melodiiStored[i]);
}
afiseazaTabel();
}

function modificaMelodie(){
var mMod = new melodie(titluM.value, muzicaM.value, versuriM.value, interpretM.value);
melodii2Show.splice(nr, 1, {
  titlu: mMod.titlu,
  muzica: mMod.muzica,
  versuri: mMod.versuri,
  interpretare: mMod.interpretare
});
var myJSON = JSON.stringify(melodii2Show);
localStorage.setItem("songsArray", myJSON);
titluM.value = null;
interpretM.value = null;
versuriM.value = null;
muzicaM.value = null;
closeForm("modifica");
afiseazaTabel();
}

function stergeMelodie(nr){
melodii2Show.splice(nr, 1);
var myJSON = JSON.stringify(melodii2Show);
localStorage.setItem("songsArray", myJSON);
afiseazaTabel();
}


function melodie(ti, mu, ve, i){
this.titlu= ti;
this.muzica = mu;
this.versuri = ve;
this.interpretare = i;
this.randNou = function() {return "<tr><td>" + this.titlu +"</td><td>" + this.interpretare + "</td><td>" + this.versuri +"</td><td>" + this.muzica + "</td>"}
}

function adaugaMelodie(frm) {
var mNoua = new melodie(frm.titlu.value, frm.muzica.value, frm.versuri.value, frm.interpret.value);
melodii2Show.push({
  titlu: mNoua.titlu,
  muzica: mNoua.muzica,
  versuri: mNoua.versuri,
  interpretare: mNoua.interpretare
});
var myJSON = JSON.stringify(melodii2Show);
localStorage.setItem("songsArray", myJSON);
frm.titlu.value = null;
frm.interpret.value = null;
frm.versuri.value = null;
frm.muzica.value = null;
closeForm("adauga");
afiseazaTabel();
}
      function openFormA() {
        document.getElementById("adauga").style.display = "block";
      }
	        function openForm(rand) {
        let frm = document.getElementById("modifica");
		frm.style.display = "block";
		nr = rand;
		titluM.value = melodii2Show[nr].titlu;
		interpretM.value = melodii2Show[nr].interpretare;
		versuriM.value = melodii2Show[nr].versuri;
		muzicaM.value = melodii2Show[nr].muzica;
      }
      function closeForm(opt) {
        document.getElementById(opt).style.display = "none";
      }

</script>

</body>
</html>
