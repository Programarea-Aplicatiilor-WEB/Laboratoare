<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Tabel melodii</title>
    <style>
        table {
            font-family: arial, sans-serif;
            border-collapse: collapse;
            width: 100%;
        }
        td, th {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
        }
        * {
            box-sizing: border-box;
        }
        .formPopup {
            display: none;
            position: fixed;
            left: 45%;
            top: 5%;
            transform: translate(-50%, 5%);
            border: 3px solid #999999;
            z-index: 9;
        }
        .formContainer {
            max-width: 400px;
            padding: 20px;
            background-color: #fff;
        }
        .formContainer input[type=text] {
            width: 90%;
            padding: 10px;
            margin: 5px 0 12px 0;
            border: none;
            background: #eee;
        }
    </style>
</head>
<body>

    <h1>Melodii incarcate de pe server</h1>

    <p>
        <button onclick="getAJAX('Melodii_JSON.txt')">Incarca array melodii de pe server</button>
        <br><br>
        <button onclick="loadTable()">Incarca tabel melodii</button>
        <br><br>
        <button onclick="openFormA()">Adauga melodie</button>
    </p>

    <table id="tm">
        <tr>
            <th>Titlu</th>
            <th>Interpretata de</th>
            <th>Versuri</th>
            <th>Muzica</th>
            <th colspan="2" style="text-align:center">Operatii</th>
        </tr>
    </table>

    <div><span id="raw"></span></div>

    <div class="formPopup" id="adauga">
        <form action="javascript:;" onsubmit="adaugaMelodie(this)" class="formContainer">
            <h2>Adauga melodie</h2>
            <label for="titlu"><strong>Titlu</strong></label><br>
            <input type="text" id="titlu" placeholder="Titlul melodiei" name="titlu" required><br>

            <label for="interpretare"><strong>Interpretata de</strong></label><br>
            <input type="text" id="interpretare" placeholder="Interpretul" name="interpretare" required><br>

            <label for="versuri"><strong>Versuri</strong></label><br>
            <input type="text" id="versuri" placeholder="Autorul versurilor" name="versuri" required><br>

            <label for="muzica"><strong>Muzica</strong></label><br>
            <input type="text" id="muzica" placeholder="Compozitorul" name="muzica" required><br>

            <button type="submit" class="btn">Adauga</button>
            <button type="button" class="btn cancel" onclick="closeForm('adauga')">Close</button>
        </form>
    </div>

    <div class="formPopup" id="modifica">
        <form action="javascript:;" onsubmit="modificaMelodie()" class="formContainer">
            <h2>Modifica melodie</h2>
            <label for="titluM"><strong>Titlu</strong></label><br>
            <input type="text" id="titluM" placeholder="Titlul melodiei" name="titluM" required><br>

            <label for="interpretareM"><strong>Interpretata de</strong></label><br>
            <input type="text" id="interpretareM" placeholder="Interpretul" name="interpretareM" required><br>

            <label for="versuriM"><strong>Versuri</strong></label><br>
            <input type="text" id="versuriM" placeholder="Autorul versurilor" name="versuriM" required><br>

            <label for="muzicaM"><strong>Muzica</strong></label><br>
            <input type="text" id="muzicaM" placeholder="Compozitorul" name="muzicaM" required><br>

            <button type="submit" class="btn">Modifica</button>
            <button type="button" class="btn cancel" onclick="closeForm('modifica')">Close</button>
        </form>
    </div>

    <script>
        const melodii2Show = [];
        let fileContent;
        let nr = 0;

        async function getAJAX(file) {
            let myObject = await fetch(file);
            fileContent = await myObject.text();
        }

        function melodie(ti, mu, ve, i) {
            this.titlu = ti;
            this.muzica = mu;
            this.versuri = ve;
            this.interpretare = i;
            this.randNou = function() {
                return "<tr><td>" + this.titlu + "</td><td>" + this.interpretare +
                       "</td><td>" + this.versuri + "</td><td>" + this.muzica + "</td>";
            };
        }

        function afiseazaTabel() {
            var tabel = document.getElementById("tm");
            tabel.innerHTML = "<tr><th>Titlu</th><th>Interpretata de</th><th>Versuri</th><th>Muzica</th><th colspan='2' style='text-align:center'>Operatii</th></tr>";

            for (var i = 0; i < melodii2Show.length; i++) {
                var m = new melodie(melodii2Show[i].titlu, melodii2Show[i].muzica, melodii2Show[i].versuri, melodii2Show[i].interpretare);
                tabel.innerHTML += m.randNou() +
                    "<td><button onclick='openForm(" + i + ")'>Modificare</button></td>" +
                    "<td><button onclick='stergeMelodie(" + i + ")'>Stergere</button></td></tr>";
            }
        }

        function loadTable() {
            if (!fileContent) return;
            document.getElementById("raw").innerHTML = fileContent;
            var melodiiStored = JSON.parse(fileContent);
            melodii2Show.length = 0;
            for (var i = 0; i < melodiiStored.length; i++) {
                melodii2Show.push(melodiiStored[i]);
            }
            afiseazaTabel();
        }

        function stergeMelodie(index) {
            melodii2Show.splice(index, 1);
            localStorage.setItem("melodiiArray", JSON.stringify(melodii2Show));
            afiseazaTabel();
        }

        function adaugaMelodie(frm) {
            var mNoua = new melodie(frm.titlu.value, frm.muzica.value, frm.versuri.value, frm.interpretare.value);
            melodii2Show.push(mNoua);
            localStorage.setItem("melodiiArray", JSON.stringify(melodii2Show));
            afiseazaTabel();

            frm.reset();
            closeForm("adauga");
        }

        function openFormA() {
            document.getElementById("adauga").style.display = "block";
        }

        function openForm(rand) {
            let frm = document.getElementById("modifica");
            frm.style.display = "block";
            nr = rand;
            document.getElementById("titluM").value = melodii2Show[nr].titlu;
            document.getElementById("interpretareM").value = melodii2Show[nr].interpretare;
            document.getElementById("versuriM").value = melodii2Show[nr].versuri;
            document.getElementById("muzicaM").value = melodii2Show[nr].muzica;
        }

        function modificaMelodie() {
            var mMod = new melodie(
                document.getElementById("titluM").value,
                document.getElementById("muzicaM").value,
                document.getElementById("versuriM").value,
                document.getElementById("interpretareM").value
            );
            melodii2Show.splice(nr, 1, mMod);
            localStorage.setItem("melodiiArray", JSON.stringify(melodii2Show));

            document.getElementById("titluM").value = "";
            document.getElementById("interpretareM").value = "";
            document.getElementById("versuriM").value = "";
            document.getElementById("muzicaM").value = "";
            closeForm("modifica");
            afiseazaTabel();
        }

        function closeForm(opt) {
            document.getElementById(opt).style.display = "none";
        }
    </script>

   - Era declarat tabloul melodii2Show și funcția constructor melodie(ti, mu, ve, i) cu metoda randNou().

</body>
</html>
